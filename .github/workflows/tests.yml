# Run both test suites on every push/PR so a broken commit can't ship silently.
# (Until now the only workflow was the keep-awake ping — nothing gated merges.)
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Bot engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading_bot/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest tests -q

  dashboard:
    name: Dashboard (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: trading-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run vitest
        run: npx vitest run
